[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --tb=short
norecursedirs = _archive
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
markers =
    integration: marks tests that require a live Supabase DB connection (skip with -m "not integration")
    section1:  production readiness — Section 1: Backend Health
    section2:  production readiness — Section 2: Zerodha OAuth
    section4:  production readiness — Section 4: Behavioral Alerts API
    section8:  production readiness — Section 8: AI Coach API
    section12: production readiness — Section 12: Admin Panel API
    section13: production readiness — Section 13: Security
    section14: production readiness — Section 14: Logic & Data Correctness
    section16: production readiness — Section 16: Edge Cases
