[mypy]
# Lenient baseline for a largely-untyped codebase. The goal is to catch the
# high-value classes — attr-defined (calling a method/attr that doesn't exist,
# e.g. account.get_decrypted_token()), name-defined, and bad call args — WITHOUT
# drowning in "missing annotation" noise. Runs non-blocking in CI until triaged;
# tighten (remove ignores, flip to blocking) incrementally.
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
# Keep the bug-catching codes ON (attr-defined, name-defined, call-arg, return).
# Silence the codes that only fire because the codebase isn't fully typed.
disable_error_code = var-annotated, assignment, arg-type, index, union-attr, operator, valid-type, misc, no-any-return, type-var, list-item, dict-item, call-overload
