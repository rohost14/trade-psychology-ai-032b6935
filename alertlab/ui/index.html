<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alert Lab</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --line:#252833; --ink:#e6e8ef; --dim:#8b90a0;
    --profit:#2fb37a; --loss:#e0544f; --obs:#d9a441; --brand:#5b7cfa;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 61px)}
  .side{border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:calc(100vh - 61px)}
  .main{padding:20px 24px;overflow:auto;max-height:calc(100vh - 61px)}
  .sec{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
       margin:18px 0 8px}
  .sec:first-child{margin-top:0}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);padding:9px 12px}
  button:hover{border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:default}
  .scn{width:100%;text-align:left;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
  .scn .id{font:11px var(--mono);color:var(--dim);min-width:44px}
  .scn .t{flex:1}
  .scn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px;background:var(--line)}
  .dot.pass{background:var(--profit)} .dot.fail{background:var(--loss)}
  .bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
  .card h2{font-size:12px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
           text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
  .card .body{padding:14px 16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;padding:6px 8px}
  td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
  .mono{font-family:var(--mono);font-size:12px}
  .pill{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid;text-transform:uppercase;
        letter-spacing:.06em}
  .critical{color:var(--loss);border-color:var(--loss);background:rgba(224,84,79,.12)}
  .danger{color:var(--loss);border-color:rgba(224,84,79,.5)}
  .caution{color:var(--obs);border-color:rgba(217,164,65,.5)}
  .info{color:var(--dim);border-color:var(--line)}
  .ok{color:var(--profit)} .bad{color:var(--loss)} .dim{color:var(--dim)}
  .empty{color:var(--dim);font-size:13px;padding:4px 0}
  .flash{animation:flash .5s ease}
  @keyframes flash{from{background:rgba(91,124,250,.18)}to{background:transparent}}
  .note{color:var(--dim);font-size:11px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Alert Lab</h1>
  <span class="sub">synthetic trades · real detection logic · no auth, no market hours</span>
  <span class="sub" id="status"></span>
</header>

<div class="wrap">
  <aside class="side" id="side"><div class="empty">loading scenarios…</div></aside>
  <main class="main">
    <div class="bar">
      <button id="runAll">Run every scenario</button>
      <button id="tear">Wipe lab data</button>
      <span class="sub" id="summary"></span>
    </div>
    <div id="out"><div class="empty">Pick a scenario on the left.</div></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sev = s => `<span class="pill ${esc(s)}">${esc(s)}</span>`;
const money = n => (n < 0 ? '−' : '+') + '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN');
let SCENARIOS = [];

async function load() {
  const d = await (await fetch('/api/scenarios')).json();
  SCENARIOS = d.scenarios;
  $('#side').innerHTML = d.sections.map(section => `
    <div class="sec">${esc(section)}</div>
    ${SCENARIOS.filter(s => s.section === section).map(s => `
      <button class="scn" data-id="${esc(s.id)}">
        <span class="dot" id="dot-${esc(s.id)}"></span>
        <span class="id">${esc(s.id)}</span>
        <span class="t">${esc(s.title)}<small>${esc(s.story)}</small></span>
      </button>`).join('')}
  `).join('');
  document.querySelectorAll('.scn').forEach(b =>
    b.onclick = () => run(b.dataset.id));
}

/* The run itself finishes in milliseconds — eager Celery, no real waiting. The
   timeline is replayed at readable speed so the session can actually be watched
   unfold, which is more useful than staring at real five-second gaps. */
async function replay(timeline, mount) {
  for (const [i, f] of timeline.entries()) {
    mount.insertAdjacentHTML('beforeend', `
      <tr class="flash"><td class="mono">${esc(f.at_ist)}</td>
      <td class="mono">${esc(f.symbol)}</td>
      <td class="${f.side === 'BUY' ? 'ok' : 'bad'}">${esc(f.side)}</td>
      <td class="mono">${f.qty}</td><td class="mono">${f.price}</td>
      <td class="dim">${esc(f.note)}</td></tr>`);
    if (i < timeline.length - 1) await new Promise(r => setTimeout(r, 90));
  }
}

async function run(id) {
  $('#status').textContent = `running ${id}…`;
  $('#out').innerHTML = '<div class="empty">running…</div>';
  const r = await (await fetch('/api/run/' + id, {method: 'POST'})).json();
  $('#status').textContent = '';
  render(r);
  const dot = $('#dot-' + id);
  if (dot) dot.className = 'dot ' + (r.passed ? 'pass' : 'fail');
}

function render(r) {
  const s = r.scenario;
  const checks = r.checks.map(c => `
    <tr><td>${c.pass ? '<span class="ok">pass</span>' : '<span class="bad">FAIL</span>'}</td>
    <td class="mono">${esc(c.pattern)}</td>
    <td>${c.kind === 'must_fire' ? 'must fire' : '<b>must NOT fire</b>'}</td>
    <td class="dim">${esc(c.detail)}<br><span style="font-size:11px">${esc(c.reason)}</span></td></tr>`).join('');

  const alerts = r.alerts.length ? r.alerts.map(a => `
    <tr><td class="mono">${esc(a.detected_at_ist)}</td>
    <td>${sev(a.severity)}</td>
    <td>${esc(a.label)}<br><span class="mono dim" style="font-size:11px">${esc(a.pattern_type)}</span></td>
    <td>${esc(a.message)}</td>
    <td class="mono">${a.latency_seconds ?? '—'}s</td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">No alerts — for a control scenario that is the pass condition.</td></tr>';

  const sup = r.suppressed.length ? r.suppressed.map(x => `
    <tr><td class="mono">${esc(x.detected_at_ist)}</td>
    <td class="mono">${esc(x.detector)}</td><td>${sev(x.severity)}</td>
    <td class="dim">${esc(x.reason)}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">Nothing was detected-then-suppressed.</td></tr>';

  const guard = r.guardian.length ? r.guardian.map(a => `
    <tr><td>${sev(a.severity)}</td><td>${esc(a.label)}</td>
    <td class="dim">${esc(a.message)}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">Nothing would reach an accountability partner.</td></tr>';

  $('#out').innerHTML = `
    <div class="card"><h2>${esc(s.id)} · ${esc(s.title)} ${r.passed
        ? '<span class="ok">PASS</span>' : '<span class="bad">FAIL</span>'}</h2>
      <div class="body">
        <div class="dim">${esc(s.story)}</div>
        <div class="dim" style="margin-top:6px">capital ₹${s.capital.toLocaleString('en-IN')}
          · ${s.fills} fills · session P&amp;L ${money(r.session_pnl)}
          · ran in ${r.elapsed_ms} ms</div>
        ${r.error ? `<pre class="bad mono" style="white-space:pre-wrap">${esc(r.error)}</pre>` : ''}
      </div></div>

    <div class="card"><h2>Assertions</h2><div class="body">
      <table><thead><tr><th></th><th>Pattern</th><th>Expectation</th><th>Outcome</th></tr></thead>
      <tbody>${checks || '<tr><td colspan="4" class="empty">none declared</td></tr>'}</tbody></table>
    </div></div>

    <div class="card"><h2>Fills</h2><div class="body">
      <table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th></th></tr></thead>
      <tbody id="tl"></tbody></table></div></div>

    <div class="card"><h2>Alerts raised</h2><div class="body">
      <table><thead><tr><th>Time</th><th>Severity</th><th>Pattern</th><th>Message</th><th>Latency</th></tr></thead>
      <tbody>${alerts}</tbody></table></div></div>

    <div class="card"><h2>Suppression trace — detected, not surfaced</h2><div class="body">
      <table><thead><tr><th>Time</th><th>Detector</th><th>Severity</th><th>Why it stopped</th></tr></thead>
      <tbody>${sup}</tbody></table>
      <div class="note">The half no other tool shows. Most defects in this system are
        something firing wrongly or vanishing silently — the alert list above only
        proves the first kind.</div>
    </div></div>

    <div class="card"><h2>Would route to an accountability partner</h2><div class="body">
      <table><thead><tr><th>Severity</th><th>Pattern</th><th>Message</th></tr></thead>
      <tbody>${guard}</tbody></table>
      <div class="note">Routing only — WhatsApp delivery is parked until the business
        number exists. A <b>caution</b> appearing here would mean the severity floor
        is broken.</div>
    </div></div>

    <div class="card"><h2>Positions</h2><div class="body">
      <div class="dim" style="margin-bottom:6px">Open at end of run</div>
      ${r.positions.open.length ? `<table><tbody>${r.positions.open.map(p => `
        <tr><td class="mono">${esc(p.symbol)}</td>
        <td class="mono">${p.qty}</td><td class="mono">@ ${p.avg_entry}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">Flat — everything closed.</div>'}
      ${r.structures.length ? `<div class="dim" style="margin:10px 0 4px">Recognised structures</div>
        ${r.structures.map(x => `<div class="mono">${esc(x.underlying)} ${esc(x.label)}
          · ${x.leg_count} legs</div>`).join('')}` : ''}
      <div class="dim" style="margin:12px 0 6px">Closed rounds</div>
      ${r.positions.closed.length ? `<table><thead><tr><th>Symbol</th><th>Dir</th><th>Qty</th>
        <th>Entry</th><th>Exit</th><th>P&amp;L</th></tr></thead><tbody>
        ${r.positions.closed.map(c => `<tr><td class="mono">${esc(c.symbol)}</td>
        <td>${esc(c.direction)}</td><td class="mono">${c.qty}</td>
        <td class="mono">${c.entry}</td><td class="mono">${c.exit}</td>
        <td class="mono ${c.pnl >= 0 ? 'ok' : 'bad'}">${money(c.pnl)}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">No completed rounds.</div>'}
    </div></div>`;

  replay(r.timeline, $('#tl'));
}

$('#runAll').onclick = async () => {
  $('#runAll').disabled = true;
  $('#status').textContent = 'running every scenario…';
  const r = await (await fetch('/api/run-all', {method: 'POST'})).json();
  $('#status').textContent = '';
  $('#summary').innerHTML = `<b class="${r.passed === r.total ? 'ok' : 'bad'}">
    ${r.passed}/${r.total} passed</b>${r.failed.length ? ' · failing: ' + r.failed.join(', ') : ''}`;
  r.results.forEach(x => {
    const d = $('#dot-' + x.id);
    if (d) d.className = 'dot ' + (x.passed ? 'pass' : 'fail');
  });
  $('#runAll').disabled = false;
};

$('#tear').onclick = async () => {
  const r = await (await fetch('/api/teardown', {method: 'POST'})).json();
  $('#status').textContent = 'wiped: ' +
    Object.entries(r.deleted).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(', ');
};

load();
</script>
</body>
</html>
