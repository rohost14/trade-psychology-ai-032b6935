<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alert Lab</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --line:#252833; --ink:#e6e8ef; --dim:#8b90a0;
    --profit:#2fb37a; --loss:#e0544f; --obs:#d9a441; --brand:#5b7cfa;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 61px)}
  .side{border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:calc(100vh - 61px)}
  .main{padding:20px 24px;overflow:auto;max-height:calc(100vh - 61px)}
  .sec{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
       margin:18px 0 8px}
  .sec:first-child{margin-top:0}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
         background:var(--panel);color:var(--ink);padding:9px 12px}
  button:hover{border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:default}
  .scn{width:100%;text-align:left;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
  .scn .id{font:11px var(--mono);color:var(--dim);min-width:44px}
  .scn .t{flex:1}
  .scn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px;background:var(--line)}
  .dot.pass{background:var(--profit)} .dot.fail{background:var(--loss)}
  .bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
  .card h2{font-size:12px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
           text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
  .card .body{padding:14px 16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;padding:6px 8px}
  td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
  .mono{font-family:var(--mono);font-size:12px}
  .pill{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid;text-transform:uppercase;
        letter-spacing:.06em}
  .critical{color:var(--loss);border-color:var(--loss);background:rgba(224,84,79,.12)}
  .danger{color:var(--loss);border-color:rgba(224,84,79,.5)}
  .caution{color:var(--obs);border-color:rgba(217,164,65,.5)}
  .info{color:var(--dim);border-color:var(--line)}
  .ok{color:var(--profit)} .bad{color:var(--loss)} .dim{color:var(--dim)}
  .empty{color:var(--dim);font-size:13px;padding:4px 0}
  .flash{animation:flash .5s ease}
  @keyframes flash{from{background:rgba(91,124,250,.18)}to{background:transparent}}
  .note{color:var(--dim);font-size:11px;margin-top:10px;line-height:1.5}
  .step{border-left:2px solid var(--line);padding:8px 0 8px 12px;margin-bottom:2px}
  .stephead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
  .time{color:var(--dim);font-size:12px}
  .tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
  .tag.buy{background:rgba(47,179,122,.15);color:var(--profit)}
  .tag.sell{background:rgba(224,84,79,.15);color:var(--loss)}
  .stepstate{font-size:11px;margin-top:3px}
  .alertline{margin:8px 0 0 8px;padding:8px 10px;border-radius:8px;
             background:rgba(224,84,79,.07);border-left:2px solid var(--loss);
             display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
  .supline{margin:5px 0 0 8px;padding:4px 10px;font-size:11px;opacity:.6;
           border-left:2px solid var(--line);display:flex;gap:8px}
</style>
</head>
<body>
<header>
  <h1>Alert Lab</h1>
  <span class="sub">synthetic trades · real detection logic · no auth, no market hours</span>
  <span class="sub" id="status"></span>
</header>

<div class="wrap">
  <aside class="side" id="side"><div class="empty">loading scenarios…</div></aside>
  <main class="main">
    <div class="bar">
      <button id="runAll">Run every scenario</button>
      <button id="tear">Wipe lab data</button>
      <span class="sub" id="summary"></span>
    </div>
    <div id="out"><div class="empty">Pick a scenario on the left.</div></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sev = s => `<span class="pill ${esc(s)}">${esc(s)}</span>`;
const money = n => (n < 0 ? '−' : '+') + '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN');
let SCENARIOS = [];

async function load() {
  const d = await (await fetch('/api/scenarios')).json();
  SCENARIOS = d.scenarios;
  $('#side').innerHTML = d.sections.map(section => `
    <div class="sec">${esc(section)}</div>
    ${SCENARIOS.filter(s => s.section === section).map(s => `
      <button class="scn" data-id="${esc(s.id)}">
        <span class="dot" id="dot-${esc(s.id)}"></span>
        <span class="id">${esc(s.id)}</span>
        <span class="t">${esc(s.title)}<small>${esc(s.story)}</small></span>
      </button>`).join('')}
  `).join('');
  document.querySelectorAll('.scn').forEach(b =>
    b.onclick = () => run(b.dataset.id));
}

/* A session, unfolding.

   The run itself finishes in milliseconds — eager Celery, no real waiting — but
   showing everything at once made it impossible to tell which trade caused which
   alert, which is the single most useful thing to see. So the runner snapshots
   state after EVERY fill, and this replays those steps: the fill lands, the
   position opens or closes, and any alert it raised appears underneath it. */

const SPEED = 700;   // ms between fills — readable, not a real 5-second wait
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fillLine(f) {
  const closed = f.last_closed && f.side !== 'BUY' || (f.last_closed && f.closed_count);
  return `
    <div class="step">
      <div class="stephead">
        <span class="mono time">${esc(f.at_ist)}</span>
        <span class="tag ${f.side === 'BUY' ? 'buy' : 'sell'}">${esc(f.side)}</span>
        <span class="mono">${esc(f.symbol)}</span>
        <span class="dim mono">${f.qty} @ ${f.price}</span>
        <span class="dim">${esc(f.note || '')}</span>
        ${f.error ? '<span class="bad">FILL FAILED</span>' : ''}
      </div>
      <div class="stepstate dim mono" id="state-${esc(f.at_ist)}-${esc(f.symbol)}"></div>
    </div>`;
}

async function replaySession(timeline, mount) {
  mount.innerHTML = '';
  for (const [i, f] of timeline.entries()) {
    mount.insertAdjacentHTML('beforeend', fillLine(f));
    const step = mount.lastElementChild;
    step.classList.add('flash');

    // Position state after this fill — what the trader would see on screen.
    const openTxt = f.open && f.open.length
      ? 'open: ' + f.open.map(p => `${p.symbol} ${p.qty}`).join(', ')
      : 'flat';
    const pnlTxt = f.closed_count
      ? ` · ${f.closed_count} closed · session ${money(f.session_pnl)}`
      : '';
    const lastTxt = f.last_closed && f.last_closed.exit_ist === f.at_ist
      ? ` · closed ${f.last_closed.symbol} ${money(f.last_closed.pnl)}` : '';
    step.querySelector('.stepstate').innerHTML =
      esc(openTxt) + esc(pnlTxt) + `<span class="${f.last_closed && f.last_closed.pnl < 0 ? 'bad' : 'ok'}">${esc(lastTxt)}</span>`;

    await sleep(SPEED / 2);

    // Alerts raised BY THIS FILL, appearing where they belong.
    for (const a of (f.new_alerts || [])) {
      step.insertAdjacentHTML('beforeend', `
        <div class="alertline flash">
          ${sev(a.severity)}
          <b>${esc(a.label)}</b>
          <span class="dim">${esc(a.message)}</span>
          ${a.would_route_to_guardian ? '<span class="pill critical">→ guardian</span>' : ''}
        </div>`);
      await sleep(SPEED / 2);
    }
    for (const x of (f.new_suppressed || [])) {
      step.insertAdjacentHTML('beforeend', `
        <div class="supline">
          <span class="mono dim">${esc(x.detector)}</span>
          <span class="dim">detected, not shown — ${esc(x.reason)}</span>
        </div>`);
      await sleep(200);
    }
    if (i < timeline.length - 1) await sleep(SPEED / 2);
  }
}

/* One scenario, replayed. */
async function run(id) {
  const s = SCENARIOS.find(x => x.id === id) || {};
  const out = $('#out');
  out.innerHTML = `<div class="empty">running ${esc(id)}…</div>`;
  $('#status').textContent = 'running ' + id + '…';

  const res = await fetch('/api/run/' + encodeURIComponent(id), {method: 'POST'});
  const r = await res.json();
  $('#status').textContent = '';

  if (res.status === 409) {
    out.innerHTML = `<div class="card"><div class="body">
      <b class="bad">Lab busy.</b> <span class="dim">${esc(r.detail)}</span></div></div>`;
    return;
  }

  const dot = $('#dot-' + id);
  if (dot) dot.className = 'dot ' + (r.passed ? 'pass' : 'fail');

  // The verdict first: what was asserted and what actually happened. An alert
  // list on its own cannot tell you whether silence was correct.
  const checks = (r.checks || []).map(c => `
    <tr><td>${c.pass ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}</td>
        <td class="mono">${esc(c.pattern)}</td>
        <td class="dim">${esc(c.kind.replace(/_/g, ' '))}</td>
        <td>${esc(c.detail)}<div class="dim" style="font-size:11px">${esc(c.reason || '')}</div></td>
    </tr>`).join('');

  const guardian = (r.guardian || []).map(a => `
    <tr><td>${sev(a.severity)}</td><td>${esc(a.label)}</td>
        <td class="dim">${esc(a.message)}</td></tr>`).join('');

  out.innerHTML = `
    <div class="card"><h2>${esc(id)} — ${r.passed ? '<span class="ok">passed</span>'
                                                  : '<span class="bad">failed</span>'}</h2>
      <div class="body">
        <b>${esc(s.title || '')}</b><div class="dim">${esc(s.story || '')}</div>
        ${r.error ? `<div class="bad mono" style="margin-top:8px">${esc(r.error.trim().split('\n').pop())}</div>` : ''}
        ${checks ? `<table style="margin-top:10px">${checks}</table>`
                 : '<div class="note">No assertions — this scenario only demonstrates behaviour.</div>'}
      </div>
    </div>

    <div class="card"><h2>The session, as it happened</h2>
      <div class="body"><div id="tl"></div></div>
    </div>

    <div class="card"><h2>Would route to accountability partner</h2>
      <div class="body">
        ${guardian ? `<table>${guardian}</table>`
                   : '<div class="empty">Nothing at danger or above on a guardian-eligible pattern.</div>'}
        <div class="note">Routing only. WhatsApp delivery is parked until the
        business number exists — what is shown here is the decision the pipeline
        made, which is the part worth checking now.</div>
      </div>
    </div>`;

  await replaySession(r.timeline || [], $('#tl'));
}

$('#runAll').onclick = async () => {
  $('#runAll').disabled = true;
  $('#status').textContent = 'running every scenario…';
  const res = await fetch('/api/run-all', {method: 'POST'});
  const r = await res.json();
  $('#status').textContent = '';
  if (res.status === 409) {
    $('#summary').innerHTML = `<b class="bad">lab busy</b> <span class="dim">${esc(r.detail)}</span>`;
    $('#runAll').disabled = false;
    return;
  }
  $('#summary').innerHTML = `<b class="${r.passed === r.total ? 'ok' : 'bad'}">
    ${r.passed}/${r.total} passed</b>${r.failed.length ? ' · failing: ' + r.failed.join(', ') : ''}`;
  r.results.forEach(x => {
    const d = $('#dot-' + x.id);
    if (d) d.className = 'dot ' + (x.passed ? 'pass' : 'fail');
  });
  $('#runAll').disabled = false;
};

$('#tear').onclick = async () => {
  const r = await (await fetch('/api/teardown', {method: 'POST'})).json();
  $('#status').textContent = 'wiped: ' +
    Object.entries(r.deleted).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(', ');
};

load();
</script>
</body>
</html>
