name: CI

# Deep-review P10-CFG3: gate typecheck / lint / tests / dependency audits on every
# push + PR. Start with audits non-blocking (continue-on-error) so the gate lands
# without breaking the pipeline on the known-open CFG1 vulns; flip to blocking once
# `npm audit` / `pip-audit` are clean.

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # CFG1 open; flip to blocking once clean

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway CI-only secrets (NOT real). Required so app.core.config loads.
      ENVIRONMENT: development
      ENCRYPTION_KEY: 1DdYGZsWquY-QonpyjwsjZYObNeVMpVCCz6XUbGaG_0=
      SECRET_KEY: ci-only-secret-not-used-in-prod-0123456789
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # match the Dockerfile runtime (CFG5)
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Compile-check all modules (syntax)
        run: python -m compileall -q app
      - name: Pyflakes (undefined names / scope shadows)
        # Catches the crash class py_compile CANNOT: undefined names, use-before-
        # assignment, and loop-variable import shadows (the UnboundLocalError family).
        # Only the dangerous categories fail the build; "imported but unused" etc. are
        # ignored. _archive is dead code. The lone excluded line is a quoted forward-ref
        # annotation `Optional["CompletedTrade"]` — a pyflakes false positive (not run at runtime).
        run: |
          pip install pyflakes
          OUT=$(python -m pyflakes app 2>&1 \
            | grep -v "_archive" \
            | grep -iE "undefined name|before assignment|shadowed by loop" \
            | grep -v "position_ledger_service.py.*CompletedTrade" || true)
          if [ -n "$OUT" ]; then
            echo "$OUT"
            echo "::error::pyflakes found name-scope / undefined-name bugs (crash class)"
            exit 1
          fi
          echo "pyflakes: dangerous class clean"
      - name: Import-smoke (every module must import)
        # Actually imports every module under app/ — catches bad imports like
        # `from x import NameThatDoesNotExist` that compile fine but crash at run.
        run: python -m scripts.load.import_smoke
      - name: Logic tests (no DB required)
        run: >
          python -m pytest -q
          tests/test_behavior_engine.py
          tests/test_tradebook_import.py
          tests/test_session_windows_by_exchange.py
          tests/test_trade_classifier.py
          tests/test_import_reconcile.py
          tests/test_habits_service.py
          tests/test_detector_flags.py
          tests/test_admin_deps.py
          tests/test_pnl_multiplier.py
          tests/test_stable_ct_id.py
          tests/test_flip_round.py
          tests/test_dpdp_purge_patterns.py
          tests/test_migrate_runner.py
          tests/test_behavior_summary.py
          tests/test_webhook_checksum.py
          tests/test_trade_schema_fits.py
      - name: mypy (type / attr-defined)
        # Catches the "wrong method / attribute that doesn't exist" class
        # (e.g. account.get_decrypted_token()) that only surfaced at runtime.
        # Non-blocking until the untyped-code noise is triaged; see backend/mypy.ini.
        run: pip install mypy && mypy --config-file mypy.ini app
        continue-on-error: true
      - name: pip-audit
        run: pip install pip-audit && pip-audit
        continue-on-error: true   # baseline; flip to blocking once triaged

  # DB-backed integration net: spins up throwaway Postgres + Redis service
  # containers so the tests that need a real DB/transaction (conftest builds the
  # schema via Base.metadata.create_all — no migrations needed) run on every push.
  # This is the net that catches the RUNTIME class (missing rollback #4, event
  # replay, auth guards) that static checks and no-DB unit tests cannot.
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      ENCRYPTION_KEY: 1DdYGZsWquY-QonpyjwsjZYObNeVMpVCCz6XUbGaG_0=
      SECRET_KEY: ci-only-secret-not-used-in-prod-0123456789
      ADMIN_JWT_SECRET: ci-only-admin-secret-not-used-in-prod-0123456789
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: DB-backed tests (real Postgres + Redis)
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_integration.py
          tests/test_dashboard_api.py
          tests/test_db_schema.py
          tests/test_data_integrity.py
