name: CI

# Deep-review P10-CFG3: gate typecheck / lint / tests / dependency audits on every
# push + PR. Start with audits non-blocking (continue-on-error) so the gate lands
# without breaking the pipeline on the known-open CFG1 vulns; flip to blocking once
# `npm audit` / `pip-audit` are clean.

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # CFG1 open; flip to blocking once clean

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # conftest.py has an autouse `create_tables` fixture that connects to the DB
    # for EVERY test (it builds the schema via Base.metadata.create_all — no
    # migrations needed). So the whole suite needs a live Postgres + Redis; we
    # spin up throwaway service containers rather than pretend any test is "no DB".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI-only secrets (NOT real). Required so app.core.config loads.
      ENVIRONMENT: development
      ENCRYPTION_KEY: 1DdYGZsWquY-QonpyjwsjZYObNeVMpVCCz6XUbGaG_0=
      SECRET_KEY: ci-only-secret-not-used-in-prod-0123456789
      ADMIN_JWT_SECRET: ci-only-admin-secret-not-used-in-prod-0123456789
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # match the Dockerfile runtime (CFG5)
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Compile-check all modules (syntax)
        run: python -m compileall -q app
      - name: Pyflakes (undefined names / scope shadows)
        # Catches the crash class py_compile CANNOT: undefined names, use-before-
        # assignment, and loop-variable import shadows (the UnboundLocalError family).
        # Only the dangerous categories fail the build; "imported but unused" etc. are
        # ignored. _archive is dead code (excluded).
        run: |
          pip install pyflakes
          OUT=$(python -m pyflakes app 2>&1 \
            | grep -v "_archive" \
            | grep -iE "undefined name|before assignment|shadowed by loop" || true)
          if [ -n "$OUT" ]; then
            echo "$OUT"
            echo "::error::pyflakes found name-scope / undefined-name bugs (crash class)"
            exit 1
          fi
          echo "pyflakes: dangerous class clean"
      - name: Import-smoke (every module must import)
        # Actually imports every module under app/ — catches bad imports like
        # `from x import NameThatDoesNotExist` that compile fine but crash at run.
        run: python -m scripts.load.import_smoke
      - name: Tests (real Postgres + Redis; excludes live-server production suite)
        # Full suite against the service containers: pure logic + schema-fit guard
        # + DB-backed runtime tests (rollback #4, event replay, auth guards). The
        # tests/production/* suite needs a running uvicorn, so it's excluded here.
        # tests/test_db_schema.py is also excluded: it asserts migration-created
        # indexes (e.g. idx_users_email), but CI builds the schema via conftest's
        # Base.metadata.create_all (no migrations), so those indexes legitimately
        # don't exist here — that file only makes sense against a migrated DB.
        run: >
          python -m pytest -q -p no:cacheprovider
          --ignore=tests/production
          --ignore=tests/test_db_schema.py
      - name: mypy gate (BLOCKING - fails only on findings not in the baseline)
        # Catches the "wrong method / attribute that doesn't exist" class that
        # only surfaces at runtime. This step was `continue-on-error: true`
        # until 2026-09-06, and in that state it correctly reported TWO bugs
        # that had been live for months and that nobody read:
        #   * profile.py imported a symbol that exists nowhere, so both
        #     guardian endpoints raised ImportError on every call and the
        #     trader's nominated guardian could never be confirmed or notified
        #   * danger_zone.py called get_escalation_status with the wrong
        #     argument name - TypeError on every call
        # A non-blocking check is a check nobody reads.
        #
        # It is blocking against a BASELINE, not against zero: 65 pre-existing
        # findings (Result[Any].rowcount, untyped-dict attrs, Sequence-vs-list
        # returns) are recorded in backend/mypy_baseline.txt. Turning it on
        # against zero would put CI red on day one, which is precisely the
        # state that let all of the above through.
        run: pip install mypy && python scripts/mypy_gate.py
      - name: pip-audit
        run: pip install pip-audit && pip-audit
        continue-on-error: true   # baseline; flip to blocking once triaged
